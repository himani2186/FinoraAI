{% extends "base.html" %}
{% set no_shell = true %}

{% block title %}Finora AI — Server Error (500){% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
  <h1 style="font-size: 6rem; font-weight: 900; background: linear-gradient(135deg, #ef4444, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">500</h1>
  <h2 style="font-size: 1.8rem; color: #ffffff; margin-bottom: 0.5rem;">Internal Server Error</h2>
  <p style="color: #a78bfa; max-width: 450px; margin-bottom: 2rem;">Something went wrong on our end. Please try again later.</p>
  <a href="{{ url_for('dashboard') if current_user else url_for('index') }}" style="background: linear-gradient(135deg, #7c3aed, #9333ea); color: #fff; padding: 0.75rem 1.8rem; border-radius: 12px; font-weight: 700; text-decoration: none;">
    Return to Home &rarr;
  </a>
</div>
{% endblock %}
