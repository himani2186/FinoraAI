<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f0a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a165a"/>
      <stop offset="50%" stop-color="#190e38"/>
      <stop offset="100%" stop-color="#0e0722"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="orbitPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Big Ambient Purple Backlight -->
  <circle cx="260" cy="270" r="230" fill="url(#ringGlow)"/>

  <!-- Glowing Orbit Rings Encircling Phone -->
  <g filter="url(#glow)">
    <ellipse cx="260" cy="380" rx="220" ry="60" fill="none" stroke="#a855f7" stroke-width="6" stroke-opacity="0.9" transform="rotate(-15, 260, 380)"/>
    <ellipse cx="260" cy="380" rx="180" ry="45" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.8" transform="rotate(-15, 260, 380)"/>
  </g>

  <!-- Floating Golden Coin 1 -->
  <g transform="translate(60, 310)" filter="url(#glow)">
    <ellipse cx="25" cy="25" rx="22" ry="25" fill="url(#goldCoin)"/>
    <ellipse cx="25" cy="25" rx="16" ry="19" fill="none" stroke="#fef08a" stroke-width="2"/>
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#78350f" text-anchor="middle">₹</text>
  </g>

  <!-- Floating Golden Coin 2 -->
  <g transform="translate(420, 270)" filter="url(#glow)">
    <ellipse cx="20" cy="20" rx="18" ry="20" fill="url(#goldCoin)"/>
    <ellipse cx="20" cy="20" rx="13" ry="15" fill="none" stroke="#fef08a" stroke-width="1.8"/>
    <text x="20" y="26" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="18" fill="#78350f" text-anchor="middle">₹</text>
  </g>

  <!-- Floating Smartphone (Angled) -->
  <g transform="translate(170, 70)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="200" height="360" rx="36" fill="url(#phoneFrame)" stroke="#7c3aed" stroke-width="3.5" filter="url(#glow)"/>
    <rect x="8" y="10" width="184" height="340" rx="28" fill="#0d0822" stroke="#06b6d4" stroke-width="1"/>

    <!-- Screen Notch -->
    <rect x="75" y="18" width="50" height="6" rx="3" fill="#1e1040"/>

    <!-- Screen Content: Analytics & Chart -->
    <g transform="translate(20, 45)">
      <!-- Card Mini Header -->
      <text x="5" y="15" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#a78bfa">FINORA OVERVIEW</text>
      <text x="5" y="35" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#ffffff">₹45,280</text>
      <text x="85" y="34" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#22c55e">+18.4%</text>

      <!-- Holographic Bars -->
      <g transform="translate(0, 60)">
        <rect x="10" y="90" width="16" height="50" rx="4" fill="#7c3aed"/>
        <rect x="36" y="70" width="16" height="70" rx="4" fill="#9333ea"/>
        <rect x="62" y="45" width="16" height="95" rx="4" fill="#06b6d4"/>
        <rect x="88" y="60" width="16" height="80" rx="4" fill="#22c55e"/>
        <rect x="114" y="25" width="16" height="115" rx="4" fill="#38bdf8" filter="url(#glow)"/>
        <rect x="140" y="40" width="16" height="100" rx="4" fill="#a855f7"/>

        <!-- Upward Arrow Trend -->
        <path d="M 18 85 Q 70 30 148 20" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
        <polygon points="152,18 140,16 146,27" fill="#67e8f9"/>
      </g>

      <!-- Mini Transaction Card inside phone -->
      <g transform="translate(5, 230)">
        <rect x="0" y="0" width="150" height="42" rx="10" fill="#1e1040" stroke="#7c3aed" stroke-width="1.2"/>
        <circle cx="20" cy="21" r="12" fill="#06b6d4" fill-opacity="0.2"/>
        <text x="20" y="25" font-size="12" text-anchor="middle">🛍️</text>
        <text x="40" y="18" font-size="9" font-weight="600" fill="#ffffff">Smart Saved</text>
        <text x="40" y="30" font-size="8" fill="#a78bfa">Auto-budgeting</text>
        <text x="140" y="25" font-size="10" font-weight="700" fill="#22c55e" text-anchor="end">+₹3.5k</text>
      </g>
    </g>
  </g>
</svg>