<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 360" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f0a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="225" cy="180" r="170" fill="url(#bgGlow)"/>

  <!-- Left Hologram Prediction Chart -->
  <g transform="translate(40, 100)" filter="url(#glow)">
    <!-- Base Projector Disc -->
    <ellipse cx="90" cy="180" rx="90" ry="22" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>
    <ellipse cx="90" cy="180" rx="60" ry="14" fill="#38bdf8" fill-opacity="0.15"/>

    <!-- Chart Screen Backing -->
    <rect x="15" y="30" width="150" height="120" rx="18" fill="#1e1040" fill-opacity="0.75" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Rising Glowing Bars -->
    <rect x="35" y="105" width="18" height="35" rx="4" fill="#6366f1"/>
    <rect x="62" y="85" width="18" height="55" rx="4" fill="#818cf8"/>
    <rect x="89" y="65" width="18" height="75" rx="4" fill="#38bdf8"/>
    <rect x="116" y="48" width="18" height="92" rx="4" fill="#67e8f9"/>

    <!-- Upward Trend Line with Arrow -->
    <path d="M 44 100 L 71 80 L 98 60 L 125 42" fill="none" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="125,35 133,45 120,47" fill="#a7f3d0"/>
    
    <!-- Light Beam Cones -->
    <polygon points="90,180 15,150 165,150" fill="url(#cyanGlow)" fill-opacity="0.12"/>
  </g>

  <!-- Right Cheerful Robot Mascot -->
  <g transform="translate(230, 40)">
    <!-- Antenna -->
    <rect x="88" y="20" width="6" height="30" rx="3" fill="#64748b"/>
    <circle cx="91" cy="15" r="9" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="91" cy="15" r="4" fill="#ffffff"/>

    <!-- Head -->
    <rect x="30" y="50" width="122" height="95" rx="30" fill="url(#metalBody)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="16" y="80" width="14" height="35" rx="7" fill="#7c3aed"/>
    <rect x="152" y="80" width="14" height="35" rx="7" fill="#7c3aed"/>

    <!-- Face Screen -->
    <rect x="44" y="64" width="94" height="66" rx="20" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Happy curved eyes -->
    <ellipse cx="68" cy="95" rx="12" ry="14" fill="#38bdf8" filter="url(#glow)"/>
    <ellipse cx="114" cy="95" rx="12" ry="14" fill="#38bdf8" filter="url(#glow)"/>
    <ellipse cx="68" cy="95" rx="7" ry="8" fill="#ffffff"/>
    <ellipse cx="114" cy="95" rx="7" ry="8" fill="#ffffff"/>
    <path d="M 82 114 Q 91 121 100 114" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Body Torso -->
    <rect x="42" y="155" width="98" height="100" rx="26" fill="url(#metalBody)" stroke="#94a3b8" stroke-width="2"/>
    <rect x="55" y="168" width="72" height="65" rx="16" fill="url(#darkMetal)"/>
    <circle cx="91" cy="200" r="14" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Left Arm pointing to hologram chart -->
    <path d="M 45 170 Q 10 160 -15 145" fill="none" stroke="url(#metalBody)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="-15" cy="145" r="11" fill="#7c3aed"/>

    <!-- Right Arm -->
    <path d="M 135 170 Q 165 190 155 220" fill="none" stroke="url(#metalBody)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="155" cy="220" r="11" fill="#7c3aed"/>

    <!-- Thruster base -->
    <ellipse cx="91" cy="255" rx="24" ry="10" fill="#334155"/>
    <polygon points="76,258 106,258 96,275 86,275" fill="url(#cyanGlow)" filter="url(#glow)"/>
  </g>
</svg>
