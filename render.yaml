services:
  - type: web
    name: finora-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 60"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: finora-db
    databaseName: finora
    user: finora_user
    plan: free
