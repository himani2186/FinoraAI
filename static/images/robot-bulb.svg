<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f0a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="250" cy="280" r="220" fill="url(#bgGlow)"/>

  <!-- Glowing Lightbulb (Financial Insight) -->
  <g transform="translate(325, 200)" filter="url(#glow)">
    <circle cx="45" cy="45" r="45" fill="#7c3aed" fill-opacity="0.3"/>
    <rect x="15" y="15" width="60" height="60" rx="18" fill="#1e1040" stroke="#06b6d4" stroke-width="2.5"/>
    <!-- Light Bulb Art -->
    <path d="M 45 25 C 34 25 28 32 28 40 C 28 46 32 50 35 54 L 35 60 C 35 62 37 63 39 63 L 51 63 C 53 63 55 62 55 60 L 55 54 C 58 50 62 46 62 40 C 62 32 56 25 45 25 Z" 
          fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="45" cy="40" r="6" fill="#ffffff" filter="url(#glow)"/>
    <line x1="40" y1="67" x2="50" y2="67" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Robot Mascot Group -->
  <g transform="translate(40, 60)">
    <!-- Antenna -->
    <rect x="180" y="30" width="8" height="30" rx="4" fill="#64748b"/>
    <circle cx="184" cy="25" r="10" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="184" cy="25" r="5" fill="#ffffff"/>

    <!-- Head -->
    <rect x="100" y="55" width="168" height="130" rx="55" fill="url(#metalBody)" stroke="#a78bfa" stroke-width="3"/>
    <rect x="85" y="90" width="18" height="60" rx="9" fill="url(#purpleAccent)" filter="url(#glow)"/>
    <rect x="265" y="90" width="18" height="60" rx="9" fill="url(#purpleAccent)" filter="url(#glow)"/>

    <!-- Visor / Face Screen -->
    <rect x="115" y="75" width="138" height="90" rx="35" fill="#0b081a" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M 125 90 Q 180 75 240 85" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Glowing Eyes (Visor Screen) -->
    <g filter="url(#glow)">
      <rect x="135" y="98" width="34" height="42" rx="17" fill="#06b6d4"/>
      <ellipse cx="152" cy="119" rx="14" ry="17" fill="#67e8f9"/>
      <circle cx="148" cy="114" r="5" fill="#ffffff"/>
      <rect x="199" y="98" width="34" height="42" rx="17" fill="#06b6d4"/>
      <ellipse cx="216" cy="119" rx="14" ry="17" fill="#67e8f9"/>
      <circle cx="212" cy="114" r="5" fill="#ffffff"/>
      <path d="M 170 148 Q 184 156 198 148" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Neck -->
    <rect x="160" y="183" width="48" height="18" rx="8" fill="#475569"/>

    <!-- Body Torso -->
    <path d="M 120 200 L 248 200 L 268 340 L 100 340 Z" fill="url(#metalBody)" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="145" y="225" width="78" height="65" rx="20" fill="#0b081a" stroke="#a855f7" stroke-width="2"/>
    <circle cx="184" cy="257" r="20" fill="url(#purpleAccent)" filter="url(#glow)"/>
    <circle cx="184" cy="257" r="10" fill="#06b6d4"/>
    <polygon points="184,249 191,262 177,262" fill="#ffffff"/>

    <!-- Left Arm -->
    <g>
      <circle cx="95" cy="225" r="18" fill="url(#purpleAccent)"/>
      <path d="M 90 235 Q 70 290 85 330" fill="none" stroke="url(#metalBody)" stroke-width="24" stroke-linecap="round"/>
      <circle cx="85" cy="330" r="16" fill="url(#purpleAccent)"/>
    </g>

    <!-- Right Arm (Gesturing towards bulb) -->
    <g>
      <circle cx="273" cy="225" r="18" fill="url(#purpleAccent)"/>
      <path d="M 275 235 Q 315 250 335 240" fill="none" stroke="url(#metalBody)" stroke-width="24" stroke-linecap="round"/>
      <circle cx="340" cy="240" r="16" fill="url(#purpleAccent)"/>
    </g>
  </g>
</svg>