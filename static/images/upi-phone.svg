<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 550" width="100%" height="100%">
  <defs>
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f0a1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1040"/>
      <stop offset="50%" stop-color="#160c2e"/>
      <stop offset="100%" stop-color="#0b081a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <circle cx="225" cy="275" r="200" fill="url(#phoneGlow)"/>

  <!-- Neon Glowing Rings around Phone -->
  <g filter="url(#glow)">
    <ellipse cx="225" cy="420" rx="180" ry="45" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.7"/>
    <ellipse cx="225" cy="420" rx="140" ry="32" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>

  <!-- Smartphone Frame (Isometric perspective) -->
  <g transform="translate(100, 60)">
    <!-- Phone Outer Shell -->
    <rect x="0" y="0" width="250" height="420" rx="42" fill="url(#phoneBody)" stroke="url(#neonPurple)" stroke-width="4"/>
    <!-- Phone Screen Inner Border -->
    <rect x="12" y="16" width="226" height="388" rx="32" fill="#0c071d" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Screen Speaker & Camera Notch -->
    <rect x="95" y="24" width="60" height="8" rx="4" fill="#1e1040"/>
    <circle cx="165" cy="28" r="4" fill="#06b6d4" filter="url(#glow)"/>

    <!-- Big UPI Badge in Center -->
    <g transform="translate(45, 110)">
      <!-- Outer Pulsing Ring -->
      <circle cx="80" cy="80" r="70" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" filter="url(#glow)"/>
      <circle cx="80" cy="80" r="56" fill="url(#phoneBody)" stroke="#06b6d4" stroke-width="3"/>

      <!-- UPI Text -->
      <text x="80" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">UPI</text>
      <!-- Subtitle -->
      <text x="80" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#a78bfa" text-anchor="middle">UNIFIED PAYMENTS</text>

      <!-- Verified Shield Badge Below -->
      <circle cx="80" cy="130" r="22" fill="#06b6d4" filter="url(#glow)"/>
      <path d="M 72 130 L 78 136 L 89 124" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Signal Waves / Cyber Accents -->
    <path d="M 50 320 Q 125 300 200 320" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M 60 340 Q 125 325 190 340" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Bottom Indicator Bar -->
    <rect x="85" y="385" width="80" height="4" rx="2" fill="#64748b"/>
  </g>
</svg>